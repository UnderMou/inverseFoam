# =========================
# Core properties
# k   : absolute permeability [m2]
# phi : porosity [-]
# =========================
core:
  k: 1.954671134e-12   # converted from 1.98 D
  phi: 0.22

# =========================
# Relative permeability
# Corey-type parameters
# =========================
relPerm:
  swc: 0.135
  sgr: 0.2
  sor: 0.1

  nw_: 2.46
  ng_: 1.3
  no_: 2.0

  krw0: 0.713
  krg0: 0.94
  kro0: 0.5


# =========================
# Fluid properties
# T = 35 C
# viscosities in Pa.s
# =========================
fluids:
  muw: 0.0007       # water viscosity
  muo: 0.005        # oil viscosity
  mug: 2.07e-05     # gas viscosity
  sigma_wg: 0.03    # water-gas interfacial tension [N/m]
